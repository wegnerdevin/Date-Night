<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Night ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF6EF;
    --parchment: #F2EAD8;
    --blush: #F2C4B0;
    --rose: #D4705A;
    --deep: #3A1F1A;
    --muted: #8C6A5E;
    --card: #FFFCF7;
    --border: rgba(58,31,26,0.12);
    --shadow: rgba(58,31,26,0.08);
    --cozy-bg: #FFF0EA;
    --cozy-accent: #D4705A;
    --medium-bg: #EAF2EC;
    --medium-accent: #4A8C61;
    --adventure-bg: #EAE8F5;
    --adventure-accent: #5A52A0;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--deep);
    min-height: 100vh;
    background-image: radial-gradient(circle at 20% 20%, rgba(242,196,176,0.25) 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, rgba(212,112,90,0.1) 0%, transparent 50%);
  }

  header {
    text-align: center;
    padding: 3rem 1rem 1.5rem;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    font-weight: 300;
    color: var(--deep);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  header h1 em {
    font-style: italic;
    color: var(--rose);
  }

  header p {
    font-size: 0.95rem;
    color: var(--muted);
    margin-top: 0.5rem;
    font-weight: 300;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1.25rem 4rem;
  }

  /* ── Sync status pill ── */
  .sync-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 100px;
    margin-top: 0.85rem;
  }
  .sync-pill .led {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
    transition: background 0.3s;
  }
  .sync-pill.live .led { background: var(--medium-accent); box-shadow: 0 0 0 3px rgba(74,140,97,0.18); }
  .sync-pill.error .led { background: var(--rose); box-shadow: 0 0 0 3px rgba(212,112,90,0.18); }
  .sync-pill .signout {
    background: none; border: none; color: var(--rose); cursor: pointer;
    font-family: inherit; font-size: 0.72rem; padding: 0; margin-left: 2px;
    border-left: 1px solid var(--border); padding-left: 8px;
  }
  .sync-pill .signout:hover { text-decoration: underline; }

  /* ── Streak ── */
  .streak-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.75rem;
    box-shadow: 0 2px 16px var(--shadow);
  }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--deep);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .streak-dots {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .dot {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--parchment);
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.2s;
    user-select: none;
  }
  .dot:hover { transform: scale(1.1); }
  .dot.done { background: var(--blush); border-color: var(--rose); }

  .streak-count {
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* ── Spinner ── */
  .spinner-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.75rem;
    margin-bottom: 1.75rem;
    box-shadow: 0 2px 16px var(--shadow);
  }

  .level-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .tab {
    padding: 6px 16px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab:hover { border-color: var(--rose); color: var(--rose); }
  .tab.active { background: var(--rose); border-color: var(--rose); color: white; }

  .spin-btn {
    width: 100%;
    padding: 1rem;
    border-radius: 14px;
    border: none;
    background: var(--deep);
    color: white;
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-weight: 300;
    font-style: italic;
    cursor: pointer;
    transition: transform 0.12s, background 0.15s;
    letter-spacing: 0.01em;
  }
  .spin-btn:hover { background: var(--rose); }
  .spin-btn:active { transform: scale(0.98); }

  .result {
    margin-top: 1.25rem;
    background: var(--parchment);
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 70px;
    border: 1px solid var(--border);
    animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .result.hidden { display: none; }

  @keyframes pop {
    from { transform: scale(0.92); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  .result-emoji { font-size: 2rem; flex-shrink: 0; }
  .result-text { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 300; color: var(--deep); line-height: 1.3; }

  .result-level {
    margin-left: auto;
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 100px;
    flex-shrink: 0;
  }
  .result-level.cozy { background: var(--cozy-bg); color: var(--cozy-accent); }
  .result-level.medium { background: var(--medium-bg); color: var(--medium-accent); }
  .result-level.adventure { background: var(--adventure-bg); color: var(--adventure-accent); }

  /* ── Ideas list ── */
  .ideas-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.75rem;
    box-shadow: 0 2px 16px var(--shadow);
  }

  .level-group { margin-bottom: 1.5rem; }
  .level-group:last-child { margin-bottom: 0; }

  .level-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .level-badge {
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 100px;
  }
  .badge-cozy { background: var(--cozy-bg); color: var(--cozy-accent); }
  .badge-medium { background: var(--medium-bg); color: var(--medium-accent); }
  .badge-adventure { background: var(--adventure-bg); color: var(--adventure-accent); }

  .idea-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(58,31,26,0.05);
    animation: fadein 0.25s ease;
  }
  @keyframes fadein { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }

  .idea-emoji { font-size: 1.2rem; flex-shrink: 0; }
  .idea-text { font-size: 0.92rem; color: var(--deep); flex: 1; }
  .remove-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.1s, background 0.1s;
    flex-shrink: 0;
  }
  .remove-btn:hover { color: var(--rose); background: var(--cozy-bg); }

  /* ── Add form ── */
  .add-form {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    margin-top: 1.25rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    align-items: center;
  }

  .emoji-input {
    width: 52px;
    font-size: 1.3rem;
    text-align: center;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 4px;
    background: var(--parchment);
    font-family: inherit;
  }

  .text-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    background: var(--parchment);
    color: var(--deep);
    outline: none;
    transition: border-color 0.15s;
  }
  .text-input:focus { border-color: var(--rose); }
  .text-input::placeholder { color: var(--muted); }

  .level-select {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 10px;
    background: var(--parchment);
    color: var(--deep);
    cursor: pointer;
    outline: none;
    grid-column: 1 / -1;
  }

  .add-btn {
    padding: 9px 16px;
    border-radius: 10px;
    border: none;
    background: var(--rose);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .add-btn:hover { background: var(--deep); }
  .add-btn:active { transform: scale(0.97); }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--deep);
    color: white;
    padding: 10px 20px;
    border-radius: 100px;
    font-size: 0.85rem;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .empty { font-size: 0.82rem; color: var(--muted); padding: 6px 0; }

  /* ── Sign-in gate ── */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: var(--cream);
    background-image: radial-gradient(circle at 20% 20%, rgba(242,196,176,0.3) 0%, transparent 55%),
                      radial-gradient(circle at 80% 80%, rgba(212,112,90,0.12) 0%, transparent 55%);
  }
  .gate.hidden { display: none; }
  .gate-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 8px 40px var(--shadow);
    padding: 2.5rem 2rem;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .gate-card h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 2.4rem;
    color: var(--deep);
    line-height: 1.1;
  }
  .gate-card h1 em { font-style: italic; color: var(--rose); }
  .gate-card p {
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 300;
    margin: 0.85rem 0 1.75rem;
    line-height: 1.5;
  }
  .gbtn {
    width: 100%;
    padding: 0.95rem;
    border-radius: 14px;
    border: none;
    background: var(--deep);
    color: white;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.05rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.12s;
  }
  .gbtn:hover { background: var(--rose); }
  .gbtn:active { transform: scale(0.98); }
</style>
</head>
<body>

<!-- Sign-in gate (shown until one of you signs in with Google) -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h1>Date <em>Night</em> ✨</h1>
    <p id="gate-msg">Sign in with Google to sync your date nights across both your phones.</p>
    <button class="gbtn" id="signin-btn">Continue with Google</button>
  </div>
</div>

<header>
  <h1>Date <em>Night</em> ✨</h1>
  <p>Spin for inspiration. Mark your nights. Add your own ideas.</p>
  <div class="sync-pill" id="sync-pill">
    <span class="led"></span>
    <span id="sync-text">Connecting…</span>
    <button class="signout" id="signout" style="display:none">sign out</button>
  </div>
</header>

<div class="container">

  <!-- Streak -->
  <div class="streak-section">
    <div class="section-title">❤️ Date night streak</div>
    <div class="streak-dots" id="streak-dots"></div>
    <p class="streak-count" id="streak-count"></p>
  </div>

  <!-- Spinner -->
  <div class="spinner-section">
    <div class="section-title">🎲 Spin for tonight</div>
    <div class="level-tabs">
      <button class="tab active" data-level="all" onclick="setLevel(this)">All</button>
      <button class="tab" data-level="cozy" onclick="setLevel(this)">🛋️ Cozy</button>
      <button class="tab" data-level="medium" onclick="setLevel(this)">✨ Medium</button>
      <button class="tab" data-level="adventure" onclick="setLevel(this)">🚀 Adventure</button>
    </div>
    <button class="spin-btn" onclick="spin()">Spin the wheel →</button>
    <div class="result hidden" id="result">
      <span class="result-emoji" id="result-emoji"></span>
      <span class="result-text" id="result-text"></span>
      <span class="result-level" id="result-level"></span>
    </div>
  </div>

  <!-- Ideas -->
  <div class="ideas-section">
    <div class="section-title">💡 All date ideas</div>
    <div id="cozy-list" class="level-group"></div>
    <div id="medium-list" class="level-group"></div>
    <div id="adventure-list" class="level-group"></div>

    <div class="add-form">
      <input class="emoji-input" id="new-emoji" type="text" value="⭐" maxlength="6" title="Pick an emoji">
      <input class="text-input" id="new-text" type="text" placeholder="Write a date idea..." maxlength="70">
      <button class="add-btn" id="add-btn" onclick="addIdea()">+ Add</button>
      <select class="level-select" id="new-level">
        <option value="cozy">🛋️ Cozy</option>
        <option value="medium">✨ Medium</option>
        <option value="adventure">🚀 Adventure</option>
      </select>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
// ===========================================================================
//  Firebase modular SDK (Realtime Database + Auth), loaded from the CDN.
//  Bump the version if you want the latest stable release.
// ===========================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, onValue, push, set, remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Your existing "our-week" project — Date Night lives alongside the
// scheduling app in the same Realtime Database.
const firebaseConfig = {
  apiKey: "AIzaSyBiPZFbkyoXzkLVTZK0d90rbm34fjMsOVU",
  authDomain: "our-week-a1e41.firebaseapp.com",
  databaseURL: "https://our-week-a1e41-default-rtdb.firebaseio.com",
  projectId: "our-week-a1e41",
  storageBucket: "our-week-a1e41.firebasestorage.app",
  messagingSenderId: "869005838010",
  appId: "1:869005838010:web:5fb2ded53f537581cba483"
};

// Both of you sign in with these Google accounts. This list is only for a
// friendly "wrong account" message — the REAL enforcement is your database
// rules. Keep it in sync with the emails in your rules if you ever change them.
const ALLOWED_EMAILS = ["wegnerdevin@gmail.com", "webbjess15@gmail.com"];

// Where date-night data lives in the database tree.
const ROOT = "dateNight";

// Starter ideas, planted once if the dateNight branch doesn't exist yet.
const DEFAULT_IDEAS = [
  { text: "Movie marathon with blanket forts", emoji: "🍿", level: "cozy" },
  { text: "Video game night — you pick",        emoji: "🎮", level: "cozy" },
  { text: "Bake something new together",        emoji: "🧁", level: "cozy" },
  { text: "Card games & snacks",                emoji: "🃏", level: "cozy" },
  { text: "Read the same book aloud",           emoji: "📚", level: "cozy" },
  { text: "Paint-at-home night",                emoji: "🎨", level: "cozy" },
  { text: "Cook a cuisine you've never tried",  emoji: "🌮", level: "medium" },
  { text: "Bowling or mini golf",               emoji: "🎳", level: "medium" },
  { text: "Sunrise or sunset picnic",           emoji: "🌅", level: "medium" },
  { text: "Live music or open mic night",       emoji: "🎶", level: "medium" },
  { text: "Escape room challenge",              emoji: "🧩", level: "medium" },
  { text: "Thrift store treasure hunt",         emoji: "🛍️", level: "medium" },
  { text: "Rock climbing or bouldering gym",    emoji: "🧗", level: "adventure" },
  { text: "Bike a trail you've never done",     emoji: "🚴", level: "adventure" },
  { text: "Amusement park day trip",            emoji: "🎢", level: "adventure" },
  { text: "Spontaneous camping night",          emoji: "🏕️", level: "adventure" },
  { text: "Improv or comedy show",              emoji: "🎭", level: "adventure" },
  { text: "Road trip — no destination set",     emoji: "🌊", level: "adventure" },
];

// ── Firebase init ──────────────────────────────────────────────────────
const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// ── Local state ──────────────────────────────────────────────────────
let appData = { ideas: { cozy: [], medium: [], adventure: [] }, streak: Array(8).fill(false) };
let currentLevel = 'all';
let listening = false;
let seeding = false;

// ── Sign-in gate ───────────────────────────────────────────────────────
const gate = document.getElementById('gate');

document.getElementById('signin-btn').onclick = () => {
  signInWithPopup(auth, provider).catch(err => {
    console.error('Sign-in failed:', err);
    document.getElementById('gate-msg').textContent =
      'Sign-in didn\u2019t go through (' + (err.code || 'error') + '). Try again.';
  });
};

document.getElementById('signout').onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user && user.email && ALLOWED_EMAILS.includes(user.email)) {
    gate.classList.add('hidden');
    const so = document.getElementById('signout');
    so.style.display = '';
    so.title = 'Signed in as ' + user.email;
    if (!listening) { listening = true; startListening(); }
  } else if (user) {
    // Signed in, but not one of the two accounts.
    gate.classList.remove('hidden');
    document.getElementById('gate-msg').textContent =
      'Signed in as ' + user.email + ', but this app is just for the two of you.';
    signOut(auth);
  } else {
    gate.classList.remove('hidden');
    document.getElementById('signout').style.display = 'none';
    setSync('', 'Signed out');
  }
});

// ── Sync status pill ────────────────────────────────────────────────────
function setSync(state, text) {
  const pill = document.getElementById('sync-pill');
  pill.className = 'sync-pill' + (state ? ' ' + state : '');
  document.getElementById('sync-text').textContent = text;
}

// ── Read the database into the shape the UI expects ──────────────────────
// Stored shape:  dateNight/ideas/<pushId> = {text,emoji,level,createdAt}
//                dateNight/streak/<0..7>  = boolean
function fromDb(v) {
  const grouped = { cozy: [], medium: [], adventure: [] };
  const ideas = (v && v.ideas) || {};
  Object.keys(ideas).forEach(id => {
    const it = ideas[id] || {};
    const lvl = grouped[it.level] ? it.level : 'cozy';
    grouped[lvl].push({ id, text: it.text || '', emoji: it.emoji || '⭐', createdAt: it.createdAt || 0 });
  });
  for (const lvl in grouped) grouped[lvl].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

  let streak = (v && v.streak) || [];
  // RTDB may hand streak back as an array or an object keyed "0".."7".
  const arr = [];
  for (let i = 0; i < 8; i++) arr[i] = !!(Array.isArray(streak) ? streak[i] : streak[i]);
  return { ideas: grouped, streak: arr };
}

// ── Live sync: one listener keeps both phones in step ───────────────────
function startListening() {
  const rootRef = ref(db, ROOT);
  onValue(rootRef,
    (snap) => {
      const v = snap.val();
      if (!v && !seeding) {
        // First run ever: plant the starter ideas once.
        seeding = true;
        const seed = { ideas: {}, streak: {} };
        DEFAULT_IDEAS.forEach(d => {
          const key = push(ref(db, ROOT + '/ideas')).key;
          seed.ideas[key] = { text: d.text, emoji: d.emoji, level: d.level, createdAt: Date.now() };
        });
        for (let i = 0; i < 8; i++) seed.streak[i] = false;
        set(rootRef, seed).catch(e => { console.error('Seed failed:', e); setSync('error', 'Write blocked — check rules'); });
        return; // the write fires another snapshot with the data
      }
      appData = fromDb(v || {});
      renderStreak();
      renderIdeas();
      setSync('live', 'Synced live');
    },
    (err) => {
      console.error('Database read failed:', err);
      setSync('error', "Can't read — check rules");
      showToast("Can't reach the database — your account may not have access");
    }
  );
}

// ── Spinner ────────────────────────────────────────────────────────────
function setLevel(btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentLevel = btn.dataset.level;
}

function getPool() {
  if (currentLevel === 'all') {
    return [
      ...appData.ideas.cozy.map(i => ({ ...i, level: 'cozy' })),
      ...appData.ideas.medium.map(i => ({ ...i, level: 'medium' })),
      ...appData.ideas.adventure.map(i => ({ ...i, level: 'adventure' })),
    ];
  }
  return (appData.ideas[currentLevel] || []).map(i => ({ ...i, level: currentLevel }));
}

function spin() {
  const pool = getPool();
  if (!pool.length) { showToast('No ideas in this category yet!'); return; }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const res = document.getElementById('result');
  res.classList.remove('hidden');
  res.style.animation = 'none';
  void res.offsetWidth;
  res.style.animation = '';
  document.getElementById('result-emoji').textContent = pick.emoji;
  document.getElementById('result-text').textContent = pick.text;
  const lbl = document.getElementById('result-level');
  lbl.textContent = pick.level;
  lbl.className = 'result-level ' + pick.level;
}

// ── Streak ─────────────────────────────────────────────────────────────
function renderStreak() {
  const el = document.getElementById('streak-dots');
  el.innerHTML = '';
  appData.streak.forEach((done, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (done ? ' done' : '');
    d.textContent = done ? '❤️' : '🤍';
    d.title = done ? 'Date night done!' : 'Tap to mark complete';
    d.onclick = () => toggleStreak(i);
    el.appendChild(d);
  });
  const count = appData.streak.filter(Boolean).length;
  document.getElementById('streak-count').textContent =
    count === 0 ? 'No dates marked yet — go have fun!' :
    count === 8 ? '8 dates done! You two are incredible 🎉' :
    `${count} of 8 date nights completed ✨`;
}

async function toggleStreak(i) {
  const next = !appData.streak[i];
  appData.streak[i] = next;        // optimistic; listener is source of truth
  renderStreak();
  try {
    await set(ref(db, ROOT + '/streak/' + i), next);
  } catch (e) {
    console.error('Streak update failed:', e);
    showToast("Couldn't save that — check your connection");
  }
}

// ── Ideas list ─────────────────────────────────────────────────────────
function renderIdeas() {
  ['cozy', 'medium', 'adventure'].forEach(level => {
    const el = document.getElementById(level + '-list');
    const labels = { cozy: '🛋️ Cozy', medium: '✨ Medium', adventure: '🚀 Adventure' };
    const items = appData.ideas[level] || [];
    el.innerHTML = `
      <div class="level-header">
        <span class="level-badge badge-${level}">${labels[level]}</span>
        <span style="font-size:0.78rem;color:var(--muted)">${items.length} idea${items.length !== 1 ? 's' : ''}</span>
      </div>
      ${items.length === 0 ? '<p class="empty">No ideas here yet — add one below!</p>' : ''}
    `;
    items.forEach(idea => {
      const row = document.createElement('div');
      row.className = 'idea-row';
      row.innerHTML = `
        <span class="idea-emoji">${escHtml(idea.emoji)}</span>
        <span class="idea-text">${escHtml(idea.text)}</span>
        <button class="remove-btn" title="Remove" onclick="removeIdea('${idea.id}')">✕</button>
      `;
      el.appendChild(row);
    });
  });
}

async function addIdea() {
  const textEl = document.getElementById('new-text');
  const emojiEl = document.getElementById('new-emoji');
  const btn = document.getElementById('add-btn');
  const text = textEl.value.trim();
  const emoji = emojiEl.value.trim() || '⭐';
  const level = document.getElementById('new-level').value;
  if (!text) { showToast('Write an idea first!'); return; }

  btn.disabled = true;
  try {
    // push() creates a unique key — no server-side counter, and two
    // simultaneous adds never collide.
    await push(ref(db, ROOT + '/ideas'), { text, emoji, level, createdAt: Date.now() });
    textEl.value = '';
    emojiEl.value = '⭐';
    showToast('Added! 🎉');
    // The live listener re-renders for both of you.
  } catch (e) {
    console.error('Add failed:', e);
    showToast("Couldn't add that — check your connection & rules");
  } finally {
    btn.disabled = false;
  }
}

async function removeIdea(id) {
  try {
    await remove(ref(db, ROOT + '/ideas/' + id));
    // Live listener handles the re-render.
  } catch (e) {
    console.error('Remove failed:', e);
    showToast("Couldn't remove that — check your connection");
  }
}

// ── Utils ──────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.getElementById('new-text').addEventListener('keydown', e => {
  if (e.key === 'Enter') addIdea();
});

// Inline onclick="" handlers live in page scope, but this is an ES module
// (its own scope), so expose the handlers the markup calls.
Object.assign(window, { spin, setLevel, addIdea, removeIdea, toggleStreak });
</script>
</body>
</html>
